name: 代码检查
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 检查全部依赖的已知漏洞
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
