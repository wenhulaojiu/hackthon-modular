<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>客序 · 导购工作台预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ede8;color:#213c32;font-family:"Microsoft YaHei",system-ui,sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b3d5a2;outline-offset:2px}button{border:0;background:none;color:inherit} .shell{max-width:430px;min-height:100dvh;margin:auto;background:#f5f6f1;position:relative;box-shadow:0 0 70px #23433316}.status{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;font-size:12px;font-weight:650;background:#f5f6f1}.top{padding:9px 22px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:serif;font-size:24px;font-weight:800;letter-spacing:2px}.capsule{border:1px solid #d7ddd5;border-radius:30px;letter-spacing:3px;padding:4px 12px;font-weight:bold;background:#ffffff88}.preview{margin:0 22px 18px;color:#738378;font-size:11px;display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;background:#65a26f;border-radius:50%}main{padding:0 20px 100px}h1{font-size:26px;letter-spacing:-1px;margin:4px 0 8px}h2{font-size:17px;margin:26px 0 14px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.75;margin:5px 0}.muted,small{color:#839087}small{font-size:11px}.eyebrow{font-size:11px;letter-spacing:2px;color:#89968c;margin-bottom:8px}.hero{position:relative;background:#234c3c;color:#fff;border-radius:22px;padding:24px;margin-top:22px;overflow:hidden}.hero:after{content:"序";position:absolute;right:5px;top:8px;font-family:serif;font-size:145px;color:#ffffff09;pointer-events:none}.hero p{color:#b9ccbd;font-size:12px}.hero strong{font-size:36px;letter-spacing:-1px;display:block;margin:14px 0}.pill{border-radius:7px;padding:5px 8px;font-size:10px;display:inline-block;background:#edf3e6;color:#61804a}.hero .pill{background:#ffffff16;color:#deedcf}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#fff;border-radius:15px;padding:17px 12px}.stat strong{display:block;font-size:23px;margin-bottom:6px}.stat span{font-size:11px;color:#7d8c81}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:25px 0}.shortcut{text-align:center;font-size:11px;padding:0}.ico{display:grid;place-items:center;font-size:20px;background:#e8ede1;width:45px;height:45px;border-radius:15px;margin:0 auto 9px;color:#466647}.card{background:#fff;border:1px solid #edf0e8;border-radius:17px;padding:17px;margin:10px 0}.avatar{width:43px;height:43px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;font-size:17px;background:#ebdfcd;color:#8d7050}.avatar.green{background:#dfeadb;color:#628363}.grow{flex:1}.tag{font-size:10px;color:#a5824e;background:#f8f0e0;padding:4px 7px;border-radius:5px}.tag.green{color:#528369;background:#edf5ee}.action{background:#254f3e;color:#fff;border-radius:10px;padding:11px 15px;font-size:12px}.secondary{background:#eff3e9;color:#56764c}.link{color:#71836f;font-size:11px}.nav{position:fixed;bottom:0;max-width:430px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid #e5eade;padding:12px 8px max(16px,env(safe-area-inset-bottom));z-index:5}.nav button{font-size:10px;color:#99a397}.nav button.active{color:#234c3c;font-weight:bold}.nav span{display:block;font-size:21px;margin-bottom:4px}.search{width:100%;border:0;background:#e9ede4;border-radius:12px;padding:14px 15px;color:#324d3e;margin:16px 0 8px}.filters{display:flex;gap:8px;margin:12px 0 18px}.filters button{padding:8px 14px;border-radius:9px;font-size:12px;background:#e9ede3;color:#7c8b75}.filters .active{background:#254f3e;color:#fff}.person{width:100%;text-align:left}.facts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:14px 0}.facts small{display:block;margin-bottom:7px}.timeline{border-left:1px solid #dce5d6;padding-left:17px;margin:15px 0 0}.timeline p{font-size:12px}.notice{background:#edf1e6;padding:13px 15px;border-radius:12px;font-size:12px;color:#75846b;margin:15px 0}.back{font-size:13px;margin:4px 0 20px;padding:0}.bubble{border-radius:14px;padding:13px;background:#edf2e9;font-size:13px;margin:13px 0;line-height:1.7}.divider{border-top:1px solid #edf0e9;margin:15px 0}.label{display:block;font-size:12px;color:#72816e;margin:16px 0 7px}textarea,select,.field{width:100%;border:1px solid #e0e6d9;border-radius:10px;background:#fff;padding:12px;color:#213c32}textarea{min-height:100px;resize:vertical}.full{width:100%;margin-top:18px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#243e32;color:white;border-radius:12px;padding:12px 20px;max-width:340px;width:max-content;font-size:12px;z-index:10}.subtle{font-size:11px;color:#839087;text-align:center;margin:25px 0}.metric{font-size:30px;font-weight:700;margin:10px 0}.progress{height:5px;background:#e9eee4;border-radius:5px;margin:15px 0}.progress i{display:block;background:#9fb38e;height:100%;width:66%;border-radius:5px}@media(min-width:600px){body{padding:28px 0}.shell{border-radius:28px;overflow:hidden;min-height:900px}.nav{border-radius:0 0 28px 28px}.status{padding-top:6px}}
</style></head><body><div class="shell"><div class="status"><span>9:41</span><span>▂▄▆ ▰</span></div><header class="top"><span class="brand">客序<span style="font-size:10px;font-family:system-ui;font-weight:400;margin-left:10px;letter-spacing:1px">导购工作台</span></span><span class="capsule">··· ⊙</span></header><div class="preview"><i class="dot"></i>小程序交互预览 · 全部为虚构演示数据</div><main id="app"></main><nav class="nav" aria-label="底部导航" id="nav"></nav></div><div id="toast" role="status"></div><script>
const app=document.getElementById('app'),nav=document.getElementById('nav');let page='home',selected=0,filter='全部',query='',taskDone=false,answered=false;const notes=[];const customers=[{name:'林女士',baby:'糯米',age:'8个月',birthday:'2026年3月',tag:'今日回访',amount:'2,680',color:'',desc:'辅食过渡期 · 偏好无添加产品',last:'昨天 16:32',budget:'200–300元',question:'这款米粉开封两周了，还可以退换吗？'},{name:'周女士',baby:'团团',age:'3个月',birthday:'2026年8月',tag:'新客户',amount:'598',color:'green',desc:'混合喂养 · 关注奶瓶选型',last:'今天 09:18',budget:'150–250元',question:'想选一款适合混合喂养的奶瓶。'},{name:'陈先生',baby:'可乐',age:'14个月',birthday:'2025年9月',tag:'待跟进',amount:'3,520',color:'',desc:'学步阶段 · 关注外出用品',last:'前天 11:20',budget:'300元以内',question:'周末出门用的轻便推车有推荐吗？'},{name:'许女士',baby:'豆豆',age:'6个月',birthday:'2026年5月',tag:'稳定客户',amount:'1,260',color:'green',desc:'准备添加辅食 · 偏好到店体验',last:'3天前',budget:'200元以内',question:'宝宝准备吃辅食，想来店里看看。'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=document.getElementById('toast');el.className='toast';el.textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.className='';el.textContent=''},2800)}
function go(p){page=p;query='';filter='全部';render();window.scrollTo(0,0)}function person(i){selected=i;go('detail')}function back(){return '<button class="back" onclick="go(&quot;customers&quot;)">‹ 返回我的客户</button>'}function card(c,i){return `<button class="card person" onclick="person(${i})"><div class="row"><span class="avatar ${c.color}">${c.name.slice(0,1)}</span><div class="grow"><h3>${c.name} <small>· 宝宝：${c.baby}</small></h3><small>宝宝${c.age} · 最近联系 ${c.last}</small></div><span class="tag ${c.tag==='新客户'?'green':''}">${c.tag}</span></div><div class="divider"></div><div class="row"><small>${c.desc}</small><small>›</small></div></button>`}
function render(){nav.innerHTML=[['home','⌂','首页'],['customers','♧','客户'],['questions','☏','疑难问题'],['me','◉','我的']].map(([id,icon,label])=>`<button class="${page===id||page==='detail'&&id==='customers'?'active':''}" onclick="go('${id}')"><span>${icon}</span>${label}</button>`).join('');
if(page==='home')app.innerHTML=`<div class="row"><div><div class="eyebrow">A GOOD DAY STARTS HERE</div><h1>早上好，小禾</h1><p class="muted">把每一次关心，变成恰好的陪伴。</p></div><span class="avatar green">禾</span></div><section class="hero"><div class="row"><span>本月个人销售额</span><span class="pill">青禾母婴 · 导购</span></div><strong>¥ 18,620<span style="font-size:17px;opacity:.6">.00</span></strong><div class="row"><p>较上月增长 12.8% ↗</p><small style="color:#cbdac4">演示业绩</small></div></section><div class="stats"><div class="stat"><strong>36</strong><span>我的客户</span></div><div class="stat"><strong>${taskDone?2:3}</strong><span>今日回访</span></div><div class="stat"><strong>${answered?0:1}</strong><span>待解答</span></div></div><div class="shortcuts">${[['＋','新增客户','add'],['↗','登记消费','sale'],['◷','回访待办','tasks'],['✧','导购建议','advice']].map(x=>`<button class="shortcut" onclick="go('${x[2]}')"><span class="ico">${x[0]}</span>${x[1]}</button>`).join('')}</div><div class="row"><h2 style="margin:0">今天需要你的关心</h2><button class="link" onclick="go(&quot;tasks&quot;)">查看全部 ›</button></div><div class="card"><div class="row"><span class="avatar">林</span><div class="grow"><h3>林女士 · 糯米8个月</h3><small>上次购买辅食后第7天</small></div><span class="tag">${taskDone?'已记录':'今日回访'}</span></div><p style="margin:16px 0;font-size:12px;color:#7f8b7a">关心一下宝宝近期的辅食适应情况。</p><button class="action secondary" onclick="person(0)">查看档案与跟进 ›</button></div><div class="row" style="margin-top:25px"><h2 style="margin:0">需要你来解答</h2><button class="link" onclick="go(&quot;questions&quot;)">处理记录 ›</button></div><div class="card" onclick="go(&quot;questions&quot;)" style="cursor:pointer"><div class="row"><h3>开封商品的退换咨询</h3><span class="tag ${answered?'green':''}">${answered?'演示已处理':'等待人工'}</span></div><p class="muted" style="font-size:12px">林女士 · B已将问题转交至你的私人微信A</p></div>`;
else if(page==='customers'){app.innerHTML=`<div class="eyebrow">MY CUSTOMERS</div><h1>我的客户 <small>36位</small></h1><p class="muted">只展示归属于你的客户</p><input class="search" aria-label="搜索客户" placeholder="搜索客户姓名、宝宝昵称" value="${esc(query)}" oninput="searchCustomers(this.value)"><div class="filters">${['全部','今日回访','新客户'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div id="list"></div>`;list()}
else if(page==='detail'){let c=customers[selected];app.innerHTML=back()+`<div class="card"><div class="row"><span class="avatar ${c.color}" style="width:58px;height:58px;font-size:24px">${c.name[0]}</span><div class="grow"><h1 style="font-size:24px">${c.name}</h1><small>归属导购：小禾 · 来源：对客微信B</small></div></div><div class="facts"><div><small>累计确认消费</small><strong>¥${c.amount}</strong></div><div><small>预算偏好</small><strong>${c.budget}</strong></div></div></div><h2>宝宝档案</h2><div class="card"><div class="row"><h3>${c.baby} · ${c.age}</h3><span class="pill">已知资料</span></div><p class="muted">${c.desc}</p><div class="notice">已知月龄与预算会用于接待，不重复向客户询问。</div><button class="link" onclick="toast('演示中已展示基础档案；正式版支持编辑')">档案资料 · ${c.birthday}出生</button></div><h2>最近沟通</h2><div class="card"><small>${c.last} · 客户向B咨询</small><div class="bubble">${c.question}</div><button class="link" onclick="go(selected===0?'questions':'advice')">${selected===0?'查看人工协助记录':'查看导购建议'} ›</button></div><div class="row"><h2>跟进记录</h2><button class="link" onclick="go(&quot;followup&quot;)">＋ 记录跟进</button></div><div class="card">${notes.length?notes.map(n=>`<div class="timeline"><small>刚刚 · 小禾</small><p>${esc(n)}</p></div>`).join(''):'<div class="timeline"><small>昨天 · 小禾</small><p>已根据现有资料整理客户需求，待回访确认使用情况。</p></div>'}</div><button class="action full" onclick="go(&quot;sale&quot;)">登记一笔消费</button>`}
else if(page==='questions')app.innerHTML=`<div class="eyebrow">HUMAN ASSISTANCE</div><h1>疑难问题</h1><p class="muted">你的判断，让服务更进一步。</p><div class="notice">B负责对客，A是你的私人微信。这里查看问题与进度，实际回答可以直接在A与B聊天框完成。</div><div class="card"><div class="row"><h3>林女士 · 售后咨询</h3><span class="tag ${answered?'green':''}">${answered?'演示已完成':'等待销售回答'}</span></div><small>问题编号 #DEMO-1024 · 今天09:26</small><div class="bubble">这款米粉开封两周了，还可以退换吗？</div><p style="font-size:12px">已知背景：宝宝8个月，7天前有一笔确认购买记录。客户描述与记录时间存在差异，需要人工核实。</p><div class="timeline"><p>✓ B发现问题需要人工</p><p>✓ 演示：问题及必要背景通知A</p><p>${answered?'✓ 演示：已匹配答案并回传客户':'○ 等待A带问题编号回答'}</p></div>${answered?'<div class="notice">仅演示状态变化，没有发送真实微信消息。</div>':'<button class="action full" onclick="go(&quot;answer&quot;)">体验人工回答流程</button>'}</div>`;
else if(page==='answer')app.innerHTML=`<button class="back" onclick="go(&quot;questions&quot;)">‹ 返回疑难问题</button><h1>模拟销售解答</h1><p class="muted">预览A回答、B回传的处理效果</p><div class="card"><h3>#DEMO-1024 · 林女士</h3><p>开封商品退换需要核对购买时间与门店规则。</p><label class="label" for="answer">销售答案</label><textarea id="answer" maxlength="300" placeholder="输入你的处理意见…"></textarea><button class="action full" onclick="answerDemo()">模拟匹配并回传</button><small style="display:block;margin-top:12px">仅改变演示状态，不发送微信、不写入实际工单。</small></div>`;
else if(page==='tasks')app.innerHTML=`<div class="eyebrow">TODAY’S FOLLOW-UP</div><h1>回访待办</h1><p class="muted">今天，给客户一份恰好的关心。</p>${customers.slice(0,3).map((c,i)=>`<div class="card"><div class="row"><h3>${c.name} · ${c.baby}${c.age}</h3><span class="tag">${i===0&&taskDone?'已记录':'待跟进'}</span></div><p class="muted">${i===0?'了解近期辅食适应情况':'关心近期使用体验与服务需求'}</p><button class="action secondary" onclick="person(${i})">查看客户并记录 ›</button></div>`).join('')}<p class="subtle">回访待办不会自动向客户发送消息</p>`;
else if(page==='followup')app.innerHTML=back()+`<h1>记录跟进</h1><p class="muted">${customers[selected].name} · 让每次沟通都有迹可循</p><div class="card"><label class="label" for="note">跟进情况</label><textarea id="note" maxlength="500" placeholder="记录客户反馈、需求或下一步安排"></textarea><label class="label" for="date">下次跟进日期</label><input class="field" id="date" type="date"><button class="action full" onclick="saveNote()">保存演示记录</button></div>`;
else if(page==='sale')app.innerHTML=`<button class="back" onclick="go(&quot;home&quot;)">‹ 返回首页</button><h1>登记消费</h1><p class="muted">金额和付款信息请先核实</p><div class="card"><label class="label" for="customer">选择客户</label><select id="customer">${customers.map((c,i)=>`<option value="${i}" ${i===selected?'selected':''}>${c.name} · ${c.baby}</option>`).join('')}</select><label class="label" for="amount">消费金额（元）</label><input class="field" id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"><label class="label" for="item">商品或服务</label><input class="field" id="item" maxlength="80" placeholder="例如：辅食米粉"><button class="action full" onclick="sale()">提交演示登记</button><p class="subtle">预览不会改变真实订单和经营统计</p></div>`;
else if(page==='add')app.innerHTML=`<button class="back" onclick="go(&quot;home&quot;)">‹ 返回首页</button><h1>补充客户档案</h1><div class="notice">正式流程由B接收有效新好友事件或新私聊后自动建档，并归属对应导购。这里演示手动补充。</div><div class="card"><label class="label" for="newname">客户称呼</label><input class="field" id="newname" maxlength="20" placeholder="请输入客户称呼"><button class="action full" onclick="addCustomer()">新增演示客户</button></div>`;
else if(page==='advice')app.innerHTML=`<button class="back" onclick="go(&quot;home&quot;)">‹ 返回首页</button><h1>导购建议</h1><p class="muted">先了解已知信息，再给合适建议。</p><div class="card"><h3>林女士 · 已知信息</h3><p>糯米8个月，辅食过渡期；预算200–300元。</p><div class="notice">这些信息已在档案中，不重复询问。</div></div><h2>自然分句回复示例</h2><div class="bubble">您提到糯米最近在适应辅食，我们先看看这几天的情况。</div><div class="bubble">最近吃完之后，宝宝的接受情况怎么样呀？</div><small>固定演示文案，未调用模型；自然分句自动发送仍需开发。</small>`;
else app.innerHTML=`<div class="eyebrow">MY WORKSPACE</div><h1>我的</h1><div class="card"><div class="row"><span class="avatar green">禾</span><div class="grow"><h3>小禾 <span class="pill">导购</span></h3><small>青禾母婴 · 示例门店</small></div></div><div class="divider"></div><p>对客微信B：青禾顾问小禾（演示）</p><p>私人微信A：小禾（演示）</p><small>归属关系仅作界面示意，不连接真实账号</small></div><div class="card"><h3>本月个人表现</h3><div class="metric">¥18,620</div><div class="progress"><i></i></div><small>36位客户 · 8位本月新增 · 12次已完成回访</small></div><div class="card"><h3>账号权限</h3><p>查看和维护自己的授权客户及业务</p><small>老板通过网页查看全店数据和管理团队</small></div><button class="action secondary full" onclick="location.reload()">重置本次演示</button><p class="subtle">客序 · 销售小程序交互预览<br>无真实登录、微信收发或云端同步</p>`;}
function list(){const result=customers.map((c,i)=>({c,i})).filter(({c})=>(filter==='全部'||c.tag===filter)&&(!query||c.name.includes(query)||c.baby.includes(query)));document.getElementById('list').innerHTML=result.length?result.map(({c,i})=>card(c,i)).join(''):'<p class="subtle">没有找到匹配客户</p>'}function searchCustomers(v){query=v;list()}function saveNote(){let n=document.getElementById('note').value.trim();if(!n)return toast('请先填写跟进情况');notes.push(n);taskDone=true;go('detail');toast('演示跟进已保存，仅保留在本次页面')}function answerDemo(){if(!document.getElementById('answer').value.trim())return toast('请先填写答案');answered=true;go('questions');toast('演示处理完成，没有发送真实消息')}function sale(){const amount=Number(document.getElementById('amount').value);if(!Number.isFinite(amount)||amount<=0||!document.getElementById('item').value.trim())return toast('请填写有效金额和商品');go('home');toast('演示登记已提交，真实订单未改变')}function addCustomer(){const name=document.getElementById('newname').value.trim();if(!name)return toast('请填写客户称呼');customers.push({name,baby:'待补充',age:'待补充',birthday:'待补充',tag:'新客户',amount:'0',color:'green',desc:'新建演示客户 · 资料待补充',last:'刚刚',budget:'待补充',question:'暂无聊天记录'});go('customers');toast('演示客户已添加')}render();
</script></body></html>
