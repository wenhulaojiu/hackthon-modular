<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1970" viewBox="0 0 1600 1970"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs><rect width="1600" height="1970" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.txt{font-size:18px}.label{font-size:16px}</style><text x="800" y="48" text-anchor="middle" class="title">客序 · 详细目标系统架构</text><text x="800" y="84" text-anchor="middle" class="txt">已有基础：网页、本地微信读取 / 建档 / 接待 / 发送；团队协作、云同步、小程序与A/B转交待开发</text><rect x="50" y="120" width="470" height="235" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="285" y="153" text-anchor="middle" class="head">老板网页端</text><text x="285" y="184" text-anchor="middle" class="txt">全店销售额 / 客户增长 / 员工业绩</text><text x="285" y="211" text-anchor="middle" class="txt">全店客户与宝宝档案 / 客户归属</text><text x="285" y="238" text-anchor="middle" class="txt">消费审核与退款管理（规则待确认）</text><text x="285" y="265" text-anchor="middle" class="txt">员工权限 / 商品服务 / 知识库 / AI配置</text><text x="285" y="292" text-anchor="middle" class="txt">疑难问题积压 / 处理记录 / 操作追踪</text><rect x="565" y="120" width="470" height="235" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="800" y="153" text-anchor="middle" class="head">销售小程序端 · 待开发</text><text x="800" y="184" text-anchor="middle" class="txt">我的客户 / 客户画像 / 宝宝档案</text><text x="800" y="211" text-anchor="middle" class="txt">消费登记 / 个人业绩</text><text x="800" y="238" text-anchor="middle" class="txt">回访待办 / 跟进记录 / AI导购建议</text><text x="800" y="265" text-anchor="middle" class="txt">疑难问题状态与人工回复记录</text><text x="800" y="292" text-anchor="middle" class="txt">只访问本人授权业务范围</text><rect x="1080" y="120" width="470" height="235" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="1315" y="153" text-anchor="middle" class="head">A：销售私人微信</text><text x="1315" y="184" text-anchor="middle" class="txt">销售本人正常使用微信</text><text x="1315" y="211" text-anchor="middle" class="txt">接收B发来的客户问题与必要上下文</text><text x="1315" y="238" text-anchor="middle" class="txt">在与B的聊天框引用回复 / 带编号回答</text><text x="1315" y="265" text-anchor="middle" class="txt">无需另装采集服务</text><text x="1315" y="292" text-anchor="middle" class="txt">A不是对客号，无第三个助手微信号</text><path d="M285 355L285 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 355L800 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="425" width="985" height="150" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="542.5" y="458" text-anchor="middle" class="head">统一接入与权限层 · 待开发</text><text x="542.5" y="489" text-anchor="middle" class="txt">网页会话 / 小程序登录绑定 / 电脑设备认证</text><text x="542.5" y="516" text-anchor="middle" class="txt">门店隔离 → 销售身份 → 客户归属 → 每次请求校验</text><text x="542.5" y="543" text-anchor="middle" class="txt">同源策略按客户端区分 / 输入校验 / 请求幂等 / 操作审计</text><rect x="1080" y="425" width="470" height="205" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="1315" y="458" text-anchor="middle" class="head">B：对客个人微信 + 本地服务</text><text x="1315" y="489" text-anchor="middle" class="txt">客户添加B / B承接客户消息</text><text x="1315" y="516" text-anchor="middle" class="txt">绑定门店、销售员工与私人号A</text><text x="1315" y="543" text-anchor="middle" class="txt">检测有效新好友提示或新私聊后建档</text><text x="1315" y="570" text-anchor="middle" class="txt">读取与发送复用现有本机能力</text><text x="1315" y="597" text-anchor="middle" class="txt">A会话排除客户建档、欢迎与AI接待</text><path d="M1315 355L1315 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1385" y="383" text-anchor="middle" class="label">A回答B</text><path d="M1190 425L1190 355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1260" y="383" text-anchor="middle" class="label">B转交问题</text><rect x="1080" y="700" width="470" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="1315" y="733" text-anchor="middle" class="head">客户个人微信</text><text x="1315" y="764" text-anchor="middle" class="txt">加B为好友 → 向B咨询</text><text x="1315" y="791" text-anchor="middle" class="txt">接收B的AI回答或人工答案</text><text x="1315" y="818" text-anchor="middle" class="txt">不要求客户使用销售小程序</text><path d="M1240 700L1240 630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1310" y="658" text-anchor="middle" class="label">客户咨询</text><path d="M1390 630L1390 700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1460" y="658" text-anchor="middle" class="label">B回复客户</text><path d="M550 575L550 680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="680" width="470" height="220" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="285" y="713" text-anchor="middle" class="head">客户与经营服务</text><text x="285" y="744" text-anchor="middle" class="txt">客户 / 画像 / 宝宝档案与月龄</text><text x="285" y="771" text-anchor="middle" class="txt">消费候选 → 审核确认 → 统计</text><text x="285" y="798" text-anchor="middle" class="txt">回访计划 / 待办 / 跟进记录</text><text x="285" y="825" text-anchor="middle" class="txt">商品服务 / 文档知识库 / 文件导入</text><text x="285" y="852" text-anchor="middle" class="txt">权限与归属校验贯穿业务操作</text><rect x="565" y="680" width="470" height="220" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="800" y="713" text-anchor="middle" class="head">同步与归属服务 · 待开发</text><text x="800" y="744" text-anchor="middle" class="txt">B账号 + 设备 → 员工 + 门店</text><text x="800" y="771" text-anchor="middle" class="txt">来源销售自动归属，不靠老板分配</text><text x="800" y="798" text-anchor="middle" class="txt">本地待同步队列 / 事件ID去重</text><text x="800" y="825" text-anchor="middle" class="txt">版本冲突 / 断线重连 / 增量同步</text><text x="800" y="852" text-anchor="middle" class="txt">多销售同客户冲突保留记录，不覆盖</text><path d="M1080 565L1035 765" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="975" width="470" height="220" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><text x="285" y="1008" text-anchor="middle" class="head">AI接待服务</text><text x="285" y="1039" text-anchor="middle" class="txt">门店知识 + 当前客户必要上下文</text><text x="285" y="1066" text-anchor="middle" class="txt">依据充分 → 生成回答并按规则发送</text><text x="285" y="1093" text-anchor="middle" class="txt">无依据 / 要求人工 / 特殊事项 → 转人工</text><text x="285" y="1120" text-anchor="middle" class="txt">模型密钥后端AES-GCM加密保存</text><text x="285" y="1147" text-anchor="middle" class="txt">现有接待基础；云端团队调用待接入</text><rect x="565" y="975" width="470" height="220" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><text x="800" y="1008" text-anchor="middle" class="head">疑难工单与A/B路由 · 待开发</text><text x="800" y="1039" text-anchor="middle" class="txt">工单绑定：门店 / 销售 / A / B / 客户</text><text x="800" y="1066" text-anchor="middle" class="txt">问题编号 + 原消息ID + 必要上下文</text><text x="800" y="1093" text-anchor="middle" class="txt">B通知A → 核验A身份 → 关联回答</text><text x="800" y="1120" text-anchor="middle" class="txt">暂停该问题AI回复 / 防循环与重复处理</text><text x="800" y="1147" text-anchor="middle" class="txt">人工答案交回B的原客户会话</text><rect x="1080" y="975" width="470" height="220" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="1315" y="1008" text-anchor="middle" class="head">发送、回执与异常处理</text><text x="1315" y="1039" text-anchor="middle" class="txt">原生读取 / 发送能力已有基础</text><text x="1315" y="1066" text-anchor="middle" class="txt">人工答案复用既有单次人工发送保护</text><text x="1315" y="1093" text-anchor="middle" class="txt">幂等键 / 原生回执 / 发送状态</text><text x="1315" y="1120" text-anchor="middle" class="txt">失败与结果未知区分；未知不重发</text><text x="1315" y="1147" text-anchor="middle" class="txt">设备离线排队 / 超时提醒（待扩展）</text><path d="M285 900L285 975" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 900L800 975" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 1080L565 1080" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1035 1080L1080 1080" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1500 975L1500 630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="1285" width="1500" height="220" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="800" y="1318" text-anchor="middle" class="head">统一云端数据层 · D1 / SQLite（业务表拆分与团队模型待开发）</text><text x="800" y="1349" text-anchor="middle" class="txt">门店 / 员工 / 角色 / 登录绑定 / B账号与A接收号 / 设备登记</text><text x="800" y="1376" text-anchor="middle" class="txt">客户 / 销售归属 / 微信身份映射 / 宝宝档案 / 画像 / 授权聊天上下文</text><text x="800" y="1403" text-anchor="middle" class="txt">订单与消费候选 / 回访任务 / 商品服务 / 知识库 / 模型密钥密文</text><text x="800" y="1430" text-anchor="middle" class="txt">疑难工单 / 转交通知 / 人工答案 / 发送回执 / 同步水位与去重 / 操作审计</text><text x="800" y="1457" text-anchor="middle" class="txt">现有存储为 user_states JSON快照 + revision、user_secrets密文；上述为目标数据模型</text><path d="M285 1195L285 1285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 1195L800 1285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1315 1195L1315 1285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="1585" width="725" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="412.5" y="1618" text-anchor="middle" class="head">电脑本地数据与运行环境</text><text x="412.5" y="1649" text-anchor="middle" class="txt">Windows微信登录B + 本地服务持续运行</text><text x="412.5" y="1676" text-anchor="middle" class="txt">本地D1 / 队列 / 待同步事件 / 发送防重记录</text><text x="412.5" y="1703" text-anchor="middle" class="txt">仅同步授权范围；业务数据与密钥不进入Git</text><text x="412.5" y="1730" text-anchor="middle" class="txt">B电脑离线：云端已同步数据可查，微信收发暂停</text><rect x="825" y="1585" width="725" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="1187.5" y="1618" text-anchor="middle" class="head">外部AI与权限边界</text><text x="1187.5" y="1649" text-anchor="middle" class="txt">DeepSeek / OpenAI兼容Chat Completions接口</text><text x="1187.5" y="1676" text-anchor="middle" class="txt">仅必要上下文发往所配置模型供应商</text><text x="1187.5" y="1703" text-anchor="middle" class="txt">老板看全店；销售看本人授权客户</text><text x="1187.5" y="1730" text-anchor="middle" class="txt">退款审核、跨销售重复客户和离职交接规则待确认</text><text x="800" y="1840" text-anchor="middle" class="head">闭环：客户问B → 本机接待 → 疑难工单 → B通知A → A回答 → 关联工单 → B回复原客户</text><text x="800" y="1885" text-anchor="middle" class="txt">图为目标设计；现有单会话验证不等于多销售、长期无人值守或新转交流程实机验收</text></svg>