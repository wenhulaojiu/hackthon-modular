<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1720" viewBox="0 0 1500 1720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs><rect width="1500" height="1720" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.txt{font-size:18px}.label{font-size:16px}</style><text x="750" y="48" text-anchor="middle" class="title">客序 · A/B 微信疑难问题处理流程</text><text x="750" y="85" text-anchor="middle" class="txt">A = 销售私人微信（人工回答）；B = 对客个人微信（系统接入）；无需第三个微信号</text><rect x="80" y="135" width="930" height="112" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="545" y="168" text-anchor="middle" class="head">1 · 客户向B咨询</text><text x="545" y="199" text-anchor="middle" class="txt">本机服务读取原客户会话及消息ID</text><path d="M545 247L545 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="280" width="930" height="112" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="545" y="313" text-anchor="middle" class="head">2 · AI接待判断</text><text x="545" y="344" text-anchor="middle" class="txt">有依据正常回答；无依据、客户要求人工等进入疑难流程</text><path d="M545 392L545 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="425" width="930" height="112" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="545" y="458" text-anchor="middle" class="head">3 · 建立唯一工单并暂停该问题AI回复</text><text x="545" y="489" text-anchor="middle" class="txt">绑定门店、销售、A、B、原客户、原消息与必要上下文</text><path d="M545 537L545 570" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="570" width="930" height="112" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="545" y="603" text-anchor="middle" class="head">4 · B把问题转交给A</text><text x="545" y="634" text-anchor="middle" class="txt">附客户称呼、唯一问题编号、必要上下文；记录通知回执</text><path d="M545 682L545 715" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="715" width="930" height="112" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="545" y="748" text-anchor="middle" class="head">5 · 销售用A在与B聊天框回答</text><text x="545" y="779" text-anchor="middle" class="txt">引用问题回复；无法解析引用时必须明确问题编号</text><path d="M545 827L545 860" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="860" width="930" height="112" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="545" y="893" text-anchor="middle" class="head">6 · 系统识别并核验答案</text><text x="545" y="924" text-anchor="middle" class="txt">发送者必须为绑定的A；工单必须属于该销售和B且仍待处理</text><path d="M545 972L545 1005" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="1005" width="930" height="112" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="545" y="1038" text-anchor="middle" class="head">7 · 原客户发送前复核</text><text x="545" y="1069" text-anchor="middle" class="txt">检查客户映射、工单是否已处理、接管/取消/新消息与设备状态</text><path d="M545 1117L545 1150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="1150" width="930" height="112" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="545" y="1183" text-anchor="middle" class="head">8 · B向对应客户发送人工答案</text><text x="545" y="1214" text-anchor="middle" class="txt">固定原客户会话；先持久化发送意图；沿用幂等发送保护</text><path d="M545 1262L545 1295" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="1295" width="930" height="112" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="545" y="1328" text-anchor="middle" class="head">9 · 核验回执并同步状态</text><text x="545" y="1359" text-anchor="middle" class="txt">已核实成功 → 已发送；失败或未知 → 人工核对，两端可查</text><rect x="1090" y="280" width="340" height="150" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="1260" y="313" text-anchor="middle" class="head">正常回答分支</text><text x="1260" y="344" text-anchor="middle" class="txt">依据充分 → B回复客户</text><text x="1260" y="371" text-anchor="middle" class="txt">记录上下文和发送结果</text><text x="1260" y="398" text-anchor="middle" class="txt">无需转交A</text><path d="M1010 335L1090 335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1090" y="570" width="340" height="175" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><text x="1260" y="603" text-anchor="middle" class="head">离线 / 通知未成功</text><text x="1260" y="634" text-anchor="middle" class="txt">待通知 / 发送结果未知</text><text x="1260" y="661" text-anchor="middle" class="txt">不可冒充已送达A</text><text x="1260" y="688" text-anchor="middle" class="txt">未知不盲目重发</text><text x="1260" y="715" text-anchor="middle" class="txt">原客户保留人工状态</text><path d="M1010 625L1090 625" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1090" y="860" width="340" height="175" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><text x="1260" y="893" text-anchor="middle" class="head">无法匹配 / 无权限</text><text x="1260" y="924" text-anchor="middle" class="txt">不向任何客户发送</text><text x="1260" y="951" text-anchor="middle" class="txt">要求明确编号或人工处理</text><text x="1260" y="978" text-anchor="middle" class="txt">多问题不能按最近一条猜测</text><text x="1260" y="1005" text-anchor="middle" class="txt">A会话不走客户AI接待</text><path d="M1010 915L1090 915" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1090" y="1150" width="340" height="175" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><text x="1260" y="1183" text-anchor="middle" class="head">重复 / 新消息 / 取消</text><text x="1260" y="1214" text-anchor="middle" class="txt">已处理工单拒绝再次发送</text><text x="1260" y="1241" text-anchor="middle" class="txt">新情况先复核原问题</text><text x="1260" y="1268" text-anchor="middle" class="txt">发送失败可核对后另行处理</text><text x="1260" y="1295" text-anchor="middle" class="txt">结果未知禁止自动重试</text><path d="M1010 1205L1090 1205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="1530" text-anchor="middle" class="head">状态：待通知 → 待销售回答 → 待发送 → 发送中 → 已发送</text><text x="750" y="1580" text-anchor="middle" class="txt">异常另记：通知未知 / 发送失败 / 结果未知 / 已取消 / 需复核</text><text x="750" y="1630" text-anchor="middle" class="txt">上述A/B闭环待开发；不自动解除整段会话的人工接管，恢复须通过既有核验规则</text></svg>