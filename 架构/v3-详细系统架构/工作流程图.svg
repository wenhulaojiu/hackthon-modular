<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1670" viewBox="0 0 1400 1670"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs><rect width="1400" height="1670" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:bold}.t{font-size:19px}</style><text x="700" y="48" text-anchor="middle" class="h">客序 · 一天的工作流程</text><text x="700" y="88" text-anchor="middle" class="t">A = 销售自己的私人微信     B = 客户添加的对客微信（也是个人微信）</text><rect x="250" y="120" width="900" height="110" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="700" y="155" text-anchor="middle" class="h">开始前：老板和销售做好准备</text><text x="700" y="188" text-anchor="middle" class="t">老板录入商品、价格、服务规则；销售电脑登录B并启动客序</text><text x="700" y="217" text-anchor="middle" class="t">绑定B属于哪位销售，以及该销售的私人微信A</text><path d="M700 230L700 275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="275" width="900" height="110" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="700" y="310" text-anchor="middle" class="h">① 客户加B，开始聊天</text><text x="700" y="343" text-anchor="middle" class="t">系统发现有效加好友提示或客户首条新消息后自动建档</text><text x="700" y="372" text-anchor="middle" class="t">客户自动归属B对应的销售，不用老板分配</text><path d="M700 385L700 430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="430" width="900" height="110" rx="14" fill="#ede9fe" stroke="#cbd5e1"/><text x="700" y="465" text-anchor="middle" class="h">② 客户向B提问，系统先看能不能可靠回答</text><text x="700" y="498" text-anchor="middle" class="t">结合门店资料和必要聊天内容判断</text><text x="700" y="527" text-anchor="middle" class="t">不确定、没有依据或客户要求人工时，交给销售</text><path d="M470 540L330 610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="465" y="568" text-anchor="middle" class="t">能回答</text><path d="M930 540L1030 610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="1045" y="568" text-anchor="middle" class="t">需要销售</text><rect x="60" y="610" width="550" height="130" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="335" y="645" text-anchor="middle" class="h">③ 直接处理普通咨询</text><text x="335" y="678" text-anchor="middle" class="t">B按门店设置的审阅或自动发送规则回复</text><text x="335" y="707" text-anchor="middle" class="t">销售需要审核时，先审阅再发</text><rect x="790" y="610" width="550" height="130" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="1065" y="645" text-anchor="middle" class="h">③ B把难题转给A</text><text x="1065" y="678" text-anchor="middle" class="t">带上客户称呼、问题、必要背景和编号</text><text x="1065" y="707" text-anchor="middle" class="t">暂停该问题的AI回复，避免抢答</text><path d="M1065 740L1065 785" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="785" width="550" height="130" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="1065" y="820" text-anchor="middle" class="h">④ 销售在A与B的聊天框里回答</text><text x="1065" y="853" text-anchor="middle" class="t">引用那条问题回复，或明确写出问题编号</text><text x="1065" y="882" text-anchor="middle" class="t">不用切到客户聊天，也不用先打开小程序</text><path d="M1065 915L1065 960" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="960" width="550" height="130" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="1065" y="995" text-anchor="middle" class="h">⑤ 系统找到原客户，由B把答案发过去</text><text x="1065" y="1028" text-anchor="middle" class="t">核对回答来自绑定的A、问题和客户对应</text><text x="1065" y="1057" text-anchor="middle" class="t">无法匹配就先核查；发送结果不明不重发</text><path d="M335 740 L335 1125 L700 1125 L700 1160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M1065 1090 L1065 1125 L700 1125" fill="none" stroke="#64748b" stroke-width="2"/><rect x="250" y="1160" width="900" height="110" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="700" y="1195" text-anchor="middle" class="h">⑥ 销售持续经营客户</text><text x="700" y="1228" text-anchor="middle" class="t">小程序查看自己的客户、宝宝档案、消费和待回访事项</text><text x="700" y="1257" text-anchor="middle" class="t">补充跟进记录；消费经确认后才计入经营统计</text><path d="M700 1270L700 1315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="1315" width="900" height="110" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="700" y="1350" text-anchor="middle" class="h">⑦ 老板在网页看全店情况</text><text x="700" y="1383" text-anchor="middle" class="t">查看客户增长、各销售业绩、消费与回访情况</text><text x="700" y="1412" text-anchor="middle" class="t">查看疑难问题是否处理完成，管理资料和员工权限</text><text x="700" y="1490" text-anchor="middle" class="h">这是一张目标工作流程图；团队同步、小程序及A/B自动转交尚待开发</text><text x="700" y="1540" text-anchor="middle" class="t">B电脑与本地服务需要持续运行；离线后暂停微信采集和发送</text><text x="700" y="1580" text-anchor="middle" class="t">销售只看自己的授权业务，老板看全店；不要求客户使用小程序</text><text x="700" y="1620" text-anchor="middle" class="t">回访是待办安排，不代表系统已经自动给客户发送消息</text></svg>