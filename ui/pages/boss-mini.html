function employeeBarChart(key, title, unit, rows = employeeWeeklyDemo) {
  const maximum =

  const total = rows.reduce((sum, x) => sum + x[key], 0);

  const plot = { left: 64, right: 466, top: 38, bottom: 224 };
  const width = (plot.right - plot.left) / 7;

    0, 1, 2, 3,
  ]
    .map((i) => {
      const v = (maximum * i) / 3;
      const y = plot.bottom - ((plot.bottom - plot.top) * i) / 3;
      return `<line x1="${plot.left}" y1="${y}" x2="${plot.right}" y2="${y}" stroke="#e7ede2" stroke-dasharray="${i ? "4 5" : "0"}"/><text x="${plot.left - 10}" y="${y + 6}" fill="#7b8974" font-size="17" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
    })
    .join("")}${rows
    .map((row, i) => {
      const v = row[key];
      const height = (v / maximum) * (plot.bottom - plot.top);
      const x = plot.left + i * width + width * 0.22;
      const y = plot.bottom - height;
      return `<g><rect tabindex="0" role="img" aria-label="${row.date} ${formatter(v)}${unit}" class="weekly-bar ${key === "customers" ? "customer-growth-bar" : ""}" x="${x}" y="${y}" width="${width * 0.56}" height="${height}" rx="5"><title>${row.date}：${formatter(v)}${unit}</title></rect><text x="${x + width * 0.28}" y="${y - 9}" text-anchor="middle" fill="#3f5a35" font-size="17">${formatter(v)}</text><text x="${x + width * 0.28}" y="253" text-anchor="middle" fill="#7b8974" font-size="17">${row.date}</text></g>`;
    })
    .join("")}</svg>`;
  return `<section class="card employee-trend-card"><div class="trend-card-heading"><h2>${title}</h2><span class="badge">演示</span></div><div class="trend-total">${key === "sales" ? "¥ " : ""}${formatter(total)}<span>${key === "sales" ? "七日合计" : "人 · 七日新增"}</span></div>${svg}<details class="trend-data"><summary>查看每日数据</summary><table><thead><tr><th>日期</th><th>${key === "sales" ? "销售额（元）" : "新增客户（人）"}</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${x.date}</td><td>${formatter(x[key])}</td></tr>`).join("")}</tbody></table></details></section>`;
}

// 本文件固定打开老板小程序，不受地址中的角色参数影响。
const initialRole = 0;
if (initialRole >= 0 && initialRole < 4) {
  role = initialRole;
  page = configs[role].nav[0];
}
const initialPage = new URLSearchParams(location.search).get("page");
if (initialPage) page = initialPage;
if (new URLSearchParams(location.search).has("embed")) {
  document.head.insertAdjacentHTML(
    "beforeend",
    "<style>header,.hint{display:none}.shell{margin:10px auto}.shell:not(.mobile){min-height:760px;border-radius:16px}.shell:not(.mobile) .sidebar{width:140px;padding:22px 12px}.shell:not(.mobile) .main{padding:22px}.shell.mobile{min-height:780px}</style>",
  );
}
