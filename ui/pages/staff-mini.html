<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>客序 · 员工小程序</title>
  <!-- 单文件原型：样式与交互均已内嵌，可复制本文件单独打开。 -->
  <style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font:
    14px "Microsoft YaHei",
    sans-serif;
  background: #edf2eb;
  color: #24392d;
}
button,
input,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  border: 1px solid #dce5d8;
  background: white;
  color: inherit;
  border-radius: 10px;
  padding: 11px 15px;
}
button:hover {
  background: #e9f0e4;
}
header {
  padding: 22px 30px;
  background: #fff;
  border-bottom: 1px solid #dce5d8;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
header b {
  font-size: 22px;
}
header small {
  color: #83917d;
}
.active,
.primary {
  background: #4a7ba6 !important;
  color: white !important;
  border-color: #4a7ba6;
}
#roles {
  display: flex;
  gap: 8px;
}
.hint {
  padding: 14px 30px;
  color: #718168;
  font-size: 12px;
}
.shell {
  display: flex;
  background: #fff;
  max-width: 1320px;
  margin: 0 auto 35px;
  min-height: 700px;
  border: 1px solid #dce5d8;
  border-radius: 20px;
  overflow: hidden;
}
.shell.mobile {
  width: 410px;
  min-height: 780px;
  position: relative;
  display: block;
  border: 7px solid #314331;
  border-radius: 35px;
}
.sidebar {
  width: 200px;
  background: #f9fbf7;
  padding: 26px 18px;
  flex-shrink: 0;
}
.sidebar b {
  display: block;
  font-size: 25px;
  margin: 0 0 28px;
}
.sidebar button {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 9px;
  border: 0;
  background: transparent;
}
.main {
  padding: 30px;
  flex: 1;
  min-width: 0;
}
.mobile .main {
  padding: 22px 18px 90px;
}
.mobile .sidebar {
  display: none;
}
h1 {
  font-size: 26px;
  margin: 0 0 7px;
}
h2 {
  font-size: 17px;
}
p {
  color: #819078;
  line-height: 1.8;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.card {
  background: #fff;
  border: 1px solid #dce5d8;
  border-radius: 17px;
  padding: 20px;
  box-shadow: 0 4px 15px #324c2706;
}
.metric {
  background: #f1f6ed;
}
.metric b {
  display: block;
  font-size: 30px;
  margin-top: 10px;
  color: #4a7ba6;
}
.wide {
  grid-column: 1/-1;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid #ecf0e8;
}
.muted {
  font-size: 12px;
  color: #819078;
}
.badge {
  display: inline-block;
  font-size: 11px;
  background: #edf3e7;
  padding: 5px 9px;
  border-radius: 7px;
  margin: 4px 4px 0 0;
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: #e5eddc;
  display: grid;
  place-items: center;
  color: #6b805c;
  font-weight: bold;
  font-size: 18px;
  flex-shrink: 0;
}
input,
textarea {
  border: 1px solid #d9e2d3;
  border-radius: 9px;
  padding: 12px;
  background: #f8faf6;
  width: 100%;
  outline-color: #769461;
}
input {
  margin: 12px 0;
}
textarea {
  min-height: 110px;
  margin: 10px 0;
}
.mobile .grid {
  gap: 10px;
}
.mobile .card {
  padding: 15px;
}
.mobile h1 {
  font-size: 23px;
}
.bottom {
  display: none;
}
.mobile .bottom {
  display: flex;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #e4e9df;
  padding: 12px 5px;
  justify-content: space-around;
}
.bottom button {
  padding: 11px 9px;
  font-size: 12px;
  border: 0;
}
.chart {
  height: 155px;
  display: flex;
  gap: 12px;
  align-items: end;
  padding-top: 20px;
}
.chart div {
  background: #7aa8cc;
  flex: 1;
  border-radius: 8px 8px 0 0;
  min-height: 25px;
}
.chart div:hover {
  background: #4a7ba6;
}
.customer {
  cursor: pointer;
  background: #fbfcf9;
}
.customer:hover {
  border-color: #7aa8cc;
}
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
dialog {
  border: 1px solid #dbe3d5;
  border-radius: 20px;
  padding: 26px;
  max-width: 480px;
  width: 90%;
  box-shadow: 0 20px 100px #17251744;
}
dialog::backdrop {
  background: #17251766;
}
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 25px;
  background: #29452a;
  color: white;
  border-radius: 12px;
  z-index: 10;
}
.notice {
  padding: 12px;
  background: #f2f6ec;
  border-radius: 10px;
  font-size: 12px;
  color: #728262;
}
.actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}
@media (max-width: 700px) {
  header {
    padding: 15px;
  }
  #roles {
    flex-wrap: wrap;
  }
  .shell {
    margin: 0 10px;
  }
  .shell.mobile {
    max-width: calc(100% - 20px);
  }
  .sidebar {
    width: 125px;
    padding: 15px 8px;
  }
  .main {
    padding: 18px;
  }
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .hint {
    padding: 12px;
  }
  .wide {
    grid-column: auto;
  }
}
select {
  display: block;
  width: 100%;
  padding: 11px 8px;
  border: 1px solid #d9e2d3;
  border-radius: 9px;
  background: #f8faf6;
  color: #24392d;
  font: inherit;
  margin-top: 7px;
}
select:disabled {
  opacity: 0.5;
}
.geo {
  display: flex;
  gap: 10px;
  margin: 12px 0;
}
.geo label {
  flex: 1;
  min-width: 0;
  font-size: 12px;
}
dialog {
  max-height: 88vh;
  overflow-y: auto;
}
.mobile .geo {
  flex-wrap: wrap;
}
.mobile .geo label {
  min-width: 85px;
}
.mobile .grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.mobile .grid > .card,
.mobile .grid > button.card {
  min-width: 0;
  padding: 12px;
}
.mobile .grid h2 {
  font-size: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.mobile .grid p {
  font-size: 12px;
  overflow-wrap: anywhere;
}
.mobile .grid .muted {
  font-size: 11px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.mobile .grid .row {
  flex-wrap: wrap;
  gap: 7px;
}
.mobile .grid .tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mobile .grid .tabs button,
.mobile .grid > .card > button {
  padding: 8px;
  font-size: 11px;
  max-width: 100%;
}
.mobile .grid .metric b,
.mobile .grid > .metric b {
  font-size: 24px;
}
.mobile .grid .customer .avatar {
  width: 38px;
  height: 38px;
  font-size: 15px;
}
.mobile .grid .customer .row {
  align-items: center;
}
.mobile .grid > button.card strong {
  font-size: 25px !important;
}
.mobile .grid > button.card > span {
  font-size: 12px !important;
}
.mobile .grid > button.card > span:first-child {
  font-size: 15px !important;
}
.mobile .grid .badge {
  font-size: 10px;
}
dialog .grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (max-width: 700px) {
  .shell:not(.mobile) .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .shell:not(.mobile) .card {
    padding: 12px;
  }
  .shell:not(.mobile) .grid h2 {
    font-size: 15px;
  }
  .shell:not(.mobile) .grid .row {
    flex-wrap: wrap;
  }
}

/* ==== 2026-11-13 评审改版 ==== */
/* 全局字号放大 */
body { font-size: 16px; }
h1 { font-size: 26px; }
h2 { font-size: 19px; }
button, input, textarea, select { font-size: 15px; }
.muted, .notice, .badge { font-size: 13px; }

/* 门店卡片：浅绿底区分白背景 */
.store-card { background: #f0f6e9; border-color: #d9e6cb; transition: box-shadow .16s, border-color .16s; }
.store-card:hover { border-color: #b9d29e; box-shadow: 0 6px 18px #4a6b2f14; }
.store-detail-button { background: #e2efd6; border-color: #c8dcaf; color: #3f6428; font-weight: 600; }
.store-detail-button:hover { background: #7b9e29; border-color: #7b9e29; color: #fff; }

/* 活动选门店 / 待办：前置小方块 + 后置大勾选框，选中绿对号 */
.campaign-store-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.campaign-store { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f5f8f0; border: 1px solid #dce5d8; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: background .15s, border-color .15s; }
.campaign-store.checked { background: #e9f3dd; border-color: #9cbf6f; }
.campaign-store-name { font-weight: 600; font-size: 16px; }
.campaign-check, .todo-check { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin: 0; border: 2px solid #b9cbaa; border-radius: 8px; background: #fff; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
.campaign-check::after, .todo-check::after { content: ""; display: block; width: 13px; height: 7px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg); opacity: 0; margin-top: -4px; transition: opacity .12s; }
.campaign-check:checked, .todo-check:checked { background: #7b9e29; border-color: #7b9e29; }
.campaign-check:checked::after, .todo-check:checked::after { opacity: 1; }
.todo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 6px; border-bottom: 1px solid #e7ede2; cursor: pointer; }
.todo-row:last-child { border-bottom: 0; }
.todo-text { flex: 1; font-size: 15px; }
.todo-row.checked .todo-text { color: #8a967f; text-decoration: line-through; }

/* 返回上一级链接 */
.back-link { display: inline-flex; margin-bottom: 12px; background: transparent; border: 0; color: #4a7ba6; font-weight: 600; padding: 4px 0; }
.back-link:hover { background: transparent; color: #7b9e29; }

/* 员工小程序：顾客横条带偏好摘要 */
.employee-customer-row { display: flex; align-items: center; gap: 12px; }
.customer-row-main { flex: 1; min-width: 0; }
.customer-note { margin: 4px 0 0; font-size: 13px; color: #7b8974; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 实际设备布局：去掉演示外壳和模拟设备边框，页面铺满浏览器。 */

.sidebar button { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 10px 12px; }
.sidebar button .nav-icon { width: 20px; height: 20px; }
.sidebar button.active, .mobile .bottom button.active { background: var(--navc) !important; color: #fff !important; border-radius: 12px; }
.sidebar button:hover:not(.active), .mobile .bottom button:hover:not(.active) { background: var(--navs); color: var(--navc); border-radius: 12px; }
.sidebar button .nav-icon, .mobile .bottom button .nav-icon { color: var(--navc, #4a7ba6); }
.sidebar button.active .nav-icon, .mobile .bottom button.active .nav-icon { color: #fff; }

.nav-0 { --navc: #5b8c3e; --navs: #edf3e5; }   /* 首页 · 青绿 */
.nav-1 { --navc: #5566b8; --navs: #eceffa; }   /* 门店/顾客 · 靛蓝 */

.nav-6 { --navc: #8a5fb0; --navs: #f3ecf9; }
.nav-7 { --navc: #5b8c3e; --navs: #edf3e5; }

/* 导航图标动画：点击时房子蹦跳、门店开合、小人摇摆、书本翻页 */
@keyframes navBounce { 0% { transform: translateY(0) } 35% { transform: translateY(-7px) } 70% { transform: translateY(2px) } 100% { transform: translateY(0) } }
@keyframes navWiggle { 0% { transform: rotate(0) } 30% { transform: rotate(-14deg) } 60% { transform: rotate(10deg) } 100% { transform: rotate(0) } }
@keyframes navFlip { 0% { transform: rotateY(0) } 50% { transform: rotateY(-55deg) } 100% { transform: rotateY(0) } }
.bottom button:active .nav-icon, .sidebar button:active .nav-icon { animation: navBounce .45s ease; }
.bottom button.nav-1:active .nav-icon, .sidebar button.nav-1:active .nav-icon { animation: navWiggle .45s ease; }
.bottom button.nav-2:active .nav-icon, .sidebar button.nav-2:active .nav-icon { animation: navWiggle .45s ease; }
.bottom button.nav-3:active .nav-icon, .sidebar button.nav-3:active .nav-icon { animation: navFlip .5s ease; }
.bottom button .nav-icon, .sidebar button .nav-icon { transition: transform .2s; transform-origin: center; transform-box: fill-box; }
.bottom button:hover .nav-icon, .sidebar button:hover .nav-icon { transform: translateY(-2px); }

function employeeBarChart(key, title, unit, rows = employeeWeeklyDemo) {
  const maximum =
    key === "sales"
      ? Math.ceil(Math.max(...rows.map((x) => x.sales)) / 1000) * 1000
      : 6;
  const total = rows.reduce((sum, x) => sum + x[key], 0);
  const formatter = (n) => Number(n).toLocaleString("zh-CN");
  const plot = { left: 64, right: 466, top: 38, bottom: 224 };
  const width = (plot.right - plot.left) / 7;
  const svg = `<svg class="weekly-chart" viewBox="0 0 480 274" role="img" aria-label="${title}柱状图，${rows.map((x) => x.date + "：" + formatter(x[key]) + unit).join("；")}"><text x="5" y="18" fill="#7b8974" font-size="17">${unit}</text>${[
    0, 1, 2, 3,
  ]
    .map((i) => {
      const v = (maximum * i) / 3;
      const y = plot.bottom - ((plot.bottom - plot.top) * i) / 3;
      return `<line x1="${plot.left}" y1="${y}" x2="${plot.right}" y2="${y}" stroke="#e7ede2" stroke-dasharray="${i ? "4 5" : "0"}"/><text x="${plot.left - 10}" y="${y + 6}" fill="#7b8974" font-size="17" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
    })
    .join("")}${rows
    .map((row, i) => {
      const v = row[key];
      const height = (v / maximum) * (plot.bottom - plot.top);
      const x = plot.left + i * width + width * 0.22;
      const y = plot.bottom - height;
      return `<g><rect tabindex="0" role="img" aria-label="${row.date} ${formatter(v)}${unit}" class="weekly-bar ${key === "customers" ? "customer-growth-bar" : ""}" x="${x}" y="${y}" width="${width * 0.56}" height="${height}" rx="5"><title>${row.date}：${formatter(v)}${unit}</title></rect><text x="${x + width * 0.28}" y="${y - 9}" text-anchor="middle" fill="#3f5a35" font-size="17">${formatter(v)}</text><text x="${x + width * 0.28}" y="253" text-anchor="middle" fill="#7b8974" font-size="17">${row.date}</text></g>`;
    })
    .join("")}</svg>`;
  return `<section class="card employee-trend-card"><div class="trend-card-heading"><h2>${title}</h2></div><div class="trend-total">${key === "sales" ? "¥ " : ""}${formatter(total)}<span>${key === "sales" ? "七日合计" : "人 · 七日新增"}</span></div>${svg}<details class="trend-data"><summary>查看每日数据</summary><table><thead><tr><th>日期</th><th>${key === "sales" ? "销售额（元）" : "新增客户（人）"}</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${x.date}</td><td>${formatter(x[key])}</td></tr>`).join("")}</tbody></table></details></section>`;
}

  return `<div class="card"><div class="muted">按所在地筛选</div><div class="geo"><label>省份<select onchange="setStoreFilter('province',this.value)">${opts(CHINA_GEO.map((x) => x.name), sf.province, "全部省份")}</select></label><label>城市<select ${!sf.province ? "disabled" : ""} onchange="setStoreFilter('city',this.value)">${opts(cities, sf.city, "全部城市")}</select></label><label>区 / 县<select ${!sf.city ? "disabled" : ""} onchange="setStoreFilter('district',this.value)">${opts(districts, sf.district, "全部区县")}</select></label></div><input aria-label="搜索门店" placeholder="搜索门店、地址、负责人…" value="${esc(sf.query)}" oninput="sf.query=this.value;updateStores()"><div class="geo"><label>排序指标<select onchange="setStoreFilter('sort',this.value)">${[
    ["customers", "顾客人数"],
    ["employees", "员工人数"],
    ["today", "今日销售额"],
  ]
    .map(
      ([v, t]) =>
        `<option value="${v}" ${sf.sort === v ? "selected" : ""}>${t}</option>`,
    )
    .join(
      "",
    )}</select></label><label>排序方向<select onchange="setStoreFilter('direction',this.value)"><option value="desc" ${sf.direction === "desc" ? "selected" : ""}>从高到低</option><option value="asc" ${sf.direction === "asc" ? "selected" : ""}>从低到高</option></select></label></div><button onclick="sf={province:'',city:'',district:'',sort:'customers',direction:'desc',query:''};render()">重置筛选</button></div><p id="store-count"></p><div id="store-list" class="grid"></div>`;
}
function setStoreFilter(k, v) {
  sf[k] = v;
  if (k === "province") {
    sf.city = "";
    sf.district = "";
  }
  if (k === "city") sf.district = "";
  render();
}
function updateStores() {
  const list = document.getElementById("store-list");
  if (!list) return;
  const rows = stores
    .filter(
      (x) =>
        (!sf.province || x.province === sf.province) &&
        (!sf.city || x.city === sf.city) &&
        (!sf.district || x.district === sf.district) &&
        [x.name, x.province, x.city, x.district, x.address, x.manager]
          .join("")
          .includes(sf.query),
    )
    .sort(
      (a, b) => (sf.direction === "asc" ? 1 : -1) * (a[sf.sort] - b[sf.sort]),
    );
  document.getElementById("store-count").textContent =
    "符合条件的门店：" + rows.length + " 家";
  list.innerHTML = rows.length
    ? rows
        .map(
          (x) =>
            `<div class="card store-card"><h2>青禾母婴 · ${x.name}</h2><div class="muted">${x.province} · ${x.city} · ${x.district}</div><p>顾客 ${x.customers} 人 ｜ 员工 ${x.employees} 人</p><span class="badge">今日销售 ¥ ${x.today.toLocaleString()}</span><br><br><button class="store-detail-button" onclick="store('${x.name}')">查看详情 →</button></div>`,
        )
        .join("")
    : '<div class="card wide"><h2>暂无符合条件的门店</h2><p>请调整所在地或搜索关键词。</p></div>';
}
function store(name) {
  const x = stores.find((x) => x.name === name);
  modal(
    `<h2>青禾母婴 · ${esc(x.name)}</h2><h2>门店位置</h2><p>${esc(x.province + x.city + x.district + x.address)}</p><div class="row"><span>负责人</span><b>${esc(x.manager)}</b></div><div class="row"><span>负责人联系方式</span><span>${esc(x.phone)}</span></div><h2>经营数据</h2><div class="grid">${[
      ["服务顾客", x.customers + " 人"],
      ["员工人数", x.employees + " 人"],
      ["当日销售额", "¥ " + x.today.toLocaleString()],
      ["当周销售额", "¥ " + x.week.toLocaleString()],
      ["当月销售额", "¥ " + x.month.toLocaleString()],
    ]
      .map(
        ([t, v]) =>
          `<div class="card metric">${t}<b style="font-size:23px">${v}</b></div>`,
      )
      .join(
        "",
      )}</div><p class="muted">当周按周一至今统计，当月按本月1日至今统计。</p><div class="actions"><button onclick="closeModal()">关闭</button></div>`,
  );
}
let campaignStores = [];

  campaignStores = [];

  modal(
    `<h2>创建活动</h2><input id="campaign-name" placeholder="活动名称，如周末母婴体验日"><textarea id="campaign-content" placeholder="活动介绍与服务内容"></textarea><h2>${staff ? "选择目标客户" : "选择目标门店"}</h2><div class="campaign-store-list">${(staff ? data.customers : stores).map((x) => `<label class="campaign-store"><span class="campaign-store-name">${staff ? esc(x.name) + (x.baby ? " · " + esc(x.baby) : "") : "青禾母婴 · " + esc(x.name)}</span><input class="campaign-check campaign-target-check" type="checkbox" value="${esc(x.name)}" aria-label="选择${esc(x.name)}" onchange="this.closest('.campaign-store').classList.toggle('checked',this.checked)"></label>`).join("")}</div><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="${staff ? "closeModal();toast('已生成活动任务')" : "sendActivityNotification()"}">${staff ? "生成任务" : "发送活动通知"}</button></div>`,
  );
}
function sendActivityNotification() {
  const name = document.getElementById("campaign-name").value.trim();
  const content = document.getElementById("campaign-content").value.trim();
  const selected = [...document.querySelectorAll(".campaign-target-check:checked")].map((x) => x.value);
  if (!name) return toast("请填写活动名称");
  if (!selected.length) return toast("请选择至少一家门店");
  data.notifications = data.notifications || [];
  const now = new Date();
  const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  data.notifications.unshift({ id: `notice-${Date.now()}`, name, content, stores: selected, date });
  save();
  closeModal();
  render();
  toast(`活动通知已发送至 ${selected.length} 家门店`);
}
function download() {
  const text =
    "姓名,宝宝信息,微信号,联系方式,消费门店,累计消费额,最近联系时间,下次联系时间\n" +
    data.customers
      .map((x) =>
        [
          x.name,
          x.baby,
          x.wechat || "",
          x.phone || "",
          x.store || "",
          x.amount || 0,
          x.lastContact || "",
          x.nextContact || "",
        ]
          .map((v) => '"' + String(v).replaceAll('"', '""') + '"')
          .join(","),
      )
      .join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(
    new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" }),
  );
  a.download = "客序-示例客户.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

    });

}
function productCards() {
  ensureProducts();
  return (
    '<div class="grid">' +
    data.products
      .map(
        (x, i) =>
          `<div class="card searchable"><span class="badge">${esc(x.kind || "商品")}</span><h2>${esc(x.name)}</h2><p>${esc(x.spec || x.note || "尚未填写规格")}</p><div class="row"><b style="font-size:23px;color:#547c45">${x.price !== undefined ? "¥ " + Number(x.price).toFixed(2) : "价格待填写"}${x.unit ? " / " + esc(x.unit) : ""}</b><span class="muted">${x.stock !== undefined ? "库存 / 名额 " + esc(x.stock) : "库存待填写"}</span></div><p class="muted">编号：${esc(x.sku || "待填写")}</p><div class="tabs"><button onclick="productDetail(${i})">查看完整信息</button><button class="primary" onclick="editProduct(${i})">编辑商品信息</button><button onclick="if(confirm('移除此商品？')){data.products.splice(${i},1);save();render()}">移除</button></div></div>`,
      )
      .join("") +
    "</div>"
  );
}
function editProduct(i = -1) {
  const x = data.products[i] || { kind: "商品" };
  modal(
    `<h2>${i < 0 ? "新增" : "编辑"}商品信息</h2><p class="notice">名称和销售价格为必填项；其他字段可按实际商品补充。保存后会显示在商品列表中。</p><form onsubmit="event.preventDefault();commitProduct(${i})">${productFields.map(([k, t, type, ph]) => `<label style="display:block;margin-top:14px">${t}${["name", "price"].includes(k) ? " *" : ""}${type === "select" ? `<select id="pf-${k}"><option ${x.kind === "商品" ? "selected" : ""}>商品</option><option ${x.kind === "服务" ? "selected" : ""}>服务</option></select>` : type === "textarea" ? `<textarea id="pf-${k}" placeholder="${ph}">${esc(x[k] ?? "")}</textarea>` : `<input id="pf-${k}" type="${type}" placeholder="${ph}" value="${esc(x[k] ?? "")}" ${["name", "price"].includes(k) ? "required" : ""} ${type === "number" ? 'min="0" step="' + (k === "price" ? "0.01" : "1") + '"' : ""}>`}</label>`).join("")}<div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">保存商品信息</button></div></form>`,
  );
}
function commitProduct(i) {
  const x = {};
  productFields.forEach(([k]) => {
    let v = document.getElementById("pf-" + k).value.trim();
    if (["price", "stock"].includes(k) && v !== "") v = Number(v);
    if (v !== "") x[k] = v;
  });
  if (!x.name || x.price === undefined) return toast("请填写名称和销售价格");
  if (i < 0) data.products.push(x);
  else data.products[i] = x;
  save();
  closeModal();
  render();
  toast("商品信息已保存");
}
function productDetail(i) {
  const x = data.products[i];
  modal(
    `<button onclick="closeModal()">← 返回商品列表</button><h2>${esc(x.name)}</h2>${productFields
      .filter(([k]) => k !== "name")
      .map(
        ([k, t]) =>
          `<h2 style="font-size:14px">${t}</h2><p style="white-space:pre-wrap">${esc(x[k] ?? "未填写")}</p>`,
      )
      .join(
        "",
      )}<div class="actions"><button onclick="closeModal()">关闭</button><button class="primary" onclick="closeModal();editProduct(${i})">编辑商品信息</button></div>`,
  );
}
function migrateStages() {
  if (data.stageVersion === 1) return;
  data.customers.forEach((x, i) => {
    x.stage = x.stage || ["一段", "二段", "三段", "四段"][i % 4];
  });
  data.stageVersion = 1;
  save();
}
function migrateCustomers() {
  if (data.customerFieldsVersion === 1) return;
  data.customers.forEach((x, i) => {
    delete x.tag;
    Object.assign(x, {
      wechat: x.wechat || "demo_customer_" + (i + 1),
      phone: x.phone || "未提供（示例）",
      store: x.store || "青禾母婴 · " + ["城南店", "万达店", "滨江店"][i % 3],
      amount: x.amount ?? [899, 1668, 910, 298][i % 4],
      lastContact: x.lastContact || "2026-11-13T10:00",
      nextContact: x.nextContact || "2026-11-16T14:00",
    });
  });
  data.customerFieldsVersion = 1;
  save();
}
ensureProducts();
migrateCustomers();
const knowledgeCategories = ["产品", "服务", "专业", "其他"];
let knowledgeCategory = "";
let knowledgeQuery = "";
function migrateKnowledge() {

  data.knowledge.forEach((x) => {

function knowledgePage() {
  return `<div class="tabs"><button class="primary" onclick="edit('knowledge')">＋ 添加知识</button><button onclick="go('客户信息')">查看客户信息</button></div><h2>知识分类</h2><div class="grid knowledge-categories">${knowledgeCategories.map((c) => `<button class="card metric knowledge-category ${knowledgeCategory === c ? "active" : ""}" aria-label="查看${c}知识" aria-pressed="${knowledgeCategory === c}" onclick="knowledgeCategory='${c}';render()"><span class="knowledge-category-name">${c}</span><strong>${data.knowledge.filter((x) => x.category === c).length} 条知识</strong></button>`).join("")}</div><div class="knowledge-results-heading"><h2>${knowledgeCategory ? knowledgeCategory + "知识" : "全部知识"}</h2>${knowledgeCategory ? `<button onclick="knowledgeCategory='';render()">查看全部</button>` : ""}</div><input aria-label="搜索知识" placeholder="搜索知识标题或内容…" value="${esc(knowledgeQuery)}" oninput="knowledgeQuery=this.value;updateKnowledge()"><p class="muted" id="knowledge-count"></p><div id="knowledge-list" class="grid"></div>`;
}
function updateKnowledge() {
  const target = document.getElementById("knowledge-list");
  if (!target) return;
  const query = knowledgeQuery.trim().toLocaleLowerCase();
  const rows = data.knowledge
    .map((x, i) => ({ x, i }))
    .filter(
      ({ x }) =>
        (!knowledgeCategory || x.category === knowledgeCategory) &&
        [x.name, x.note, x.category]
          .join(" ")
          .toLocaleLowerCase()
          .includes(query),
    );
  document.getElementById("knowledge-count").textContent =
    `共 ${rows.length} 条知识`;
  target.innerHTML = rows.length
    ? rows
        .map(
          ({ x, i }) =>
            `<article class="card"><span class="badge">${esc(x.category)}</span><h2>${esc(x.name)}</h2><p>${esc(x.note)}</p><div class="tabs"><button onclick="edit('knowledge',${i})">编辑</button><button onclick="if(confirm('删除这条知识？')){data.knowledge.splice(${i},1);save();render()}">移除</button></div></article>`,

        .join("")
    : `<div class="card wide"><h2>暂无${knowledgeCategory || "匹配的"}知识</h2><p>${query ? "请调整搜索关键词，或添加新的知识。" : "点击“添加知识”，为此分类填写内容。"}</p><button class="primary" onclick="edit('knowledge')">＋ 添加知识</button></div>`;
}
