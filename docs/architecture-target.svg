<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs><rect width="1400" height="1320" fill="#f8fafc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:bold}.t{font-size:19px}</style><text x="700" y="45" text-anchor="middle" class="h">客序 · 团队协作与微信助手目标架构</text><text x="700" y="78" text-anchor="middle" class="t">保留现有自动建档基础；云端团队协作、小程序和助手转交为待开发</text><rect x="70" y="120" width="530" height="110" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="335" y="154" text-anchor="middle" class="h">老板网页端</text><text x="335" y="189" text-anchor="middle" class="t">全店总览 / 业绩 / 员工 / 客户归属</text><rect x="800" y="120" width="530" height="110" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="1065" y="154" text-anchor="middle" class="h">销售小程序端</text><text x="1065" y="189" text-anchor="middle" class="t">我的客户 / 消费 / 回访 / 疑难问题</text><path d="M335 230L520 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="522.5" y="263" text-anchor="middle" class="t">老板权限</text><path d="M1065 230L880 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1067.5" y="263" text-anchor="middle" class="t">销售权限</text><rect x="180" y="310" width="1040" height="235" rx="14" fill="#ede9fe" stroke="#cbd5e1"/><text x="700" y="344" text-anchor="middle" class="h">统一云端后台 · 待开发</text><text x="700" y="379" text-anchor="middle" class="t">员工与设备认证 / 门店隔离 / 来源销售自动绑定 / 客户去重</text><text x="700" y="408" text-anchor="middle" class="t">客户与宝宝档案 / 消费 / 回访 / 门店知识库 / AI服务</text><text x="700" y="437" text-anchor="middle" class="t">疑难工单：问题编号 / 原客户关联 / 引用回复匹配 / 发送状态</text><text x="700" y="466" text-anchor="middle" class="t">统一数据库：门店、员工、归属关系、业务数据与处理记录</text><rect x="60" y="660" width="600" height="185" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="360" y="694" text-anchor="middle" class="h">销售电脑端 · 现有基础 + 同步扩展</text><text x="360" y="729" text-anchor="middle" class="t">Windows个人微信 + 客序本地服务</text><text x="360" y="758" text-anchor="middle" class="t">发现有效新好友提示或新私聊 → 自动建档</text><text x="360" y="787" text-anchor="middle" class="t">绑定来源销售 → 同步云端；接收答案 → 原会话发送</text><rect x="820" y="660" width="500" height="145" rx="14" fill="#ffedd5" stroke="#cbd5e1"/><text x="1070" y="694" text-anchor="middle" class="h">助手微信号接入 · 待开发</text><text x="1070" y="729" text-anchor="middle" class="t">接收带编号的客户问题和必要上下文</text><text x="1070" y="758" text-anchor="middle" class="t">转交给销售；收集引用回复并提交答案</text><path d="M360 660L420 545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="485" y="595.5" text-anchor="middle" class="t">客户与消息同步</text><path d="M660 435L660 660" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1050 545L1050 660" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1145" y="595.5" text-anchor="middle" class="t">疑难问题</text><path d="M1190 660L1190 545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="940" width="500" height="130" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="1070" y="974" text-anchor="middle" class="h">销售接收通知的个人微信</text><text x="1070" y="1009" text-anchor="middle" class="t">在与助手的聊天框中收到问题</text><text x="1070" y="1038" text-anchor="middle" class="t">引用问题消息，输入人工答案</text><path d="M970 805L970 940" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1065" y="865.5" text-anchor="middle" class="t">问题转交</text><path d="M1170 940L1170 805" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="940" width="600" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="360" y="974" text-anchor="middle" class="h">客户个人微信</text><text x="360" y="1009" text-anchor="middle" class="t">向销售工作用个人微信咨询</text><text x="360" y="1038" text-anchor="middle" class="t">接收AI回答或经助手转交的销售人工答案</text><path d="M260 940L260 845" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="355" y="885.5" text-anchor="middle" class="t">咨询</text><path d="M460 845L460 940" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="700" y="1160" text-anchor="middle" class="h">人工协助闭环</text><text x="700" y="1200" text-anchor="middle" class="t">客户咨询 → 判断需人工 → 助手通知销售 → 引用回复 → 匹配原客户 → 发送并回写状态</text><text x="700" y="1240" text-anchor="middle" class="t">转人工后暂停该问题的AI回复；结果不明不自动重发；后端按门店与销售校验权限</text><text x="700" y="1280" text-anchor="middle" class="t">销售通知微信是否与对客微信同号待确认；电脑离线时暂停该端微信采集与发送</text></svg>